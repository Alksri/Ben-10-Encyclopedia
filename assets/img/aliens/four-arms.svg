<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Original stylized portrait of Four Arms, a towering red Tetramand warrior with four arms">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="66%">
      <stop offset="0" stop-color="#33100e"/><stop offset=".52" stop-color="#110a09"/><stop offset="1" stop-color="#050706"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9564a"/><stop offset=".45" stop-color="#a92e2b"/><stop offset="1" stop-color="#5e1517"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e2422"/><stop offset="1" stop-color="#4a1012"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c26a"/><stop offset=".5" stop-color="#9b7428"/><stop offset="1" stop-color="#4a3410"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <radialGradient id="rim" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff9d7a" stop-opacity=".5"/><stop offset="1" stop-color="#ff9d7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <g stroke="#ff6a5c" stroke-width="1" opacity=".07"><path d="M0 640h800M0 720h800M100 0v800M700 0v800"/></g>
  <ellipse cx="400" cy="420" rx="270" ry="270" fill="#e2493f" opacity=".14" filter="url(#soft)"/>

  <!-- back arms -->
  <g>
    <path d="M214 470c-62 22-104 74-118 148-8 44 6 82 34 96 34 18 62-6 68-44l16-96Z" fill="url(#skinDark)"/>
    <path d="M586 470c62 22 104 74 118 148 8 44-6 82-34 96-34 18-62-6-68-44l-16-96Z" fill="url(#skinDark)"/>
    <path d="M96 678c-16 30-6 62 20 76 22 12 44 2 52-22l10-34Z" fill="#7c1d1c"/>
    <path d="M704 678c16 30 6 62-20 76-22 12-44 2-52-22l-10-34Z" fill="#7c1d1c"/>
  </g>

  <!-- torso -->
  <path d="M232 800c2-150 28-238 88-272l80-38 80 38c60 34 86 122 88 272Z" fill="url(#skin)"/>
  <path d="M232 800c2-150 28-238 88-272l24-11c-28 64-34 168-30 283Z" fill="#4a1012" opacity=".5"/>
  <path d="M568 800c-2-150-28-238-88-272l-24-11c28 64 34 168 30 283Z" fill="#4a1012" opacity=".4"/>
  <ellipse cx="400" cy="560" rx="118" ry="96" fill="url(#rim)" opacity=".6"/>

  <!-- chest harness -->
  <path d="M290 506c34 34 186 34 220 0l18 44c-46 44-210 44-256 0Z" fill="url(#armor)"/>
  <path d="M330 540v100M470 540v100M290 596h220" stroke="#3b2a0c" stroke-width="12" opacity=".55"/>
  <path d="M344 566h112v58H344Z" fill="#151317" stroke="#c9a24a" stroke-width="3"/>
  <path d="M366 588h68M366 602h44" stroke="#e8c26a" stroke-width="4" opacity=".7"/>

  <!-- front arms -->
  <path d="M258 500c-54 26-84 82-88 160-2 44 18 74 50 74 30 0 48-24 50-62l10-122Z" fill="url(#skin)"/>
  <path d="M542 500c54 26 84 82 88 160 2 44-18 74-50 74-30 0-48-24-50-62l-10-122Z" fill="url(#skin)"/>
  <g fill="#8e2422">
    <path d="M168 700c-10 34 4 66 32 78 24 10 46-2 52-28l8-32Z"/>
    <path d="M632 700c10 34-4 66-32 78-24 10-46-2-52-28l-8-32Z"/>
  </g>
  <g stroke="#5e1517" stroke-width="6" fill="none" opacity=".7">
    <path d="M178 722l28-14M192 748l30-16M622 722l-28-14M608 748l-30-16"/>
    <path d="M200 560c-14 30-20 62-20 96M600 560c14 30 20 62 20 96"/>
  </g>

  <!-- neck -->
  <path d="M344 410h112v96H344Z" fill="url(#skinDark)"/>

  <!-- head -->
  <path d="M400 158c-74 0-122 50-122 124 0 62 20 108 54 132 20 14 42 22 68 22s48-8 68-22c34-24 54-70 54-132 0-74-48-124-122-124Z" fill="url(#skin)"/>
  <path d="M278 282c0-74 48-124 122-124 20 0 38 4 54 10-46 12-78 58-78 122 0 60 18 106 54 140-8 2-16 4-24 4-76 0-128-58-128-152Z" fill="#ff8f7a" opacity=".16"/>
  <path d="M400 176c-54 0-90 34-96 88 20-30 52-46 96-46s76 16 96 46c-6-54-42-88-96-88Z" fill="#ffb4a2" opacity=".18"/>

  <!-- brow + eyes -->
  <path d="M300 276c30-18 62-18 86 0M500 276c-30-18-62-18-86 0" stroke="#5e1517" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#fff6ec">
    <ellipse cx="342" cy="300" rx="24" ry="15"/><ellipse cx="458" cy="300" rx="24" ry="15"/>
  </g>
  <g fill="#2b0b0c">
    <circle cx="344" cy="301" r="7"/><circle cx="456" cy="301" r="7"/>
  </g>
  <path d="M292 252l84-10M508 252l-84-10" stroke="#5e1517" stroke-width="9" stroke-linecap="round"/>

  <!-- nose + mouth -->
  <path d="M400 322v44l-18 14" stroke="#5e1517" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M352 414c30 18 66 18 96 0" stroke="#4a1012" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M364 420c22 8 50 8 72 0" stroke="#f0d7cc" stroke-width="4" fill="none" opacity=".55"/>

  <!-- jaw shading -->
  <path d="M330 372c20 34 44 52 70 52s50-18 70-52c-8 44-32 72-70 72s-62-28-70-72Z" fill="#4a1012" opacity=".35"/>
  <rect width="800" height="800" fill="none"/>
</svg>
