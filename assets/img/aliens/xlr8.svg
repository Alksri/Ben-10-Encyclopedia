<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Original stylized portrait of XLR8, a blue Kineceleran speedster with a visor helmet">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="68%">
      <stop offset="0" stop-color="#062a3a"/><stop offset=".5" stop-color="#061016"/><stop offset="1" stop-color="#040708"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc9f5"/><stop offset=".5" stop-color="#1d7fb0"/><stop offset="1" stop-color="#0b3550"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#186a92"/><stop offset="1" stop-color="#082538"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/><stop offset=".55" stop-color="#131c24"/><stop offset="1" stop-color="#05080a"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d6ff" stop-opacity="0"/><stop offset=".6" stop-color="#8ff0ff"/><stop offset="1" stop-color="#e8fdff"/>
    </linearGradient>
    <radialGradient id="rim" cx="30%" cy="25%" r="70%">
      <stop offset="0" stop-color="#8ff0ff" stop-opacity=".45"/><stop offset="1" stop-color="#8ff0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <g stroke="#35d6ff" stroke-width="1" opacity=".07"><path d="M0 600h800M0 690h800M140 0v800M660 0v800"/></g>
  <ellipse cx="400" cy="400" rx="280" ry="270" fill="#35d6ff" opacity=".13" filter="url(#soft)"/>

  <!-- speed streaks -->
  <g stroke="url(#streak)" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M40 330h210" stroke-width="3"/><path d="M18 386h150" stroke-width="2"/>
    <path d="M62 440h196" stroke-width="4"/><path d="M30 500h130" stroke-width="2"/>
    <path d="M600 356h170" stroke-width="3"/><path d="M650 412h130" stroke-width="2"/>
    <path d="M576 468h190" stroke-width="4"/><path d="M672 524h96" stroke-width="2"/>
  </g>

  <!-- body -->
  <path d="M264 800c6-136 40-216 116-244l20-8 20 8c76 28 110 108 116 244Z" fill="url(#skin)"/>
  <path d="M264 800c6-136 40-216 116-244l10-4c-40 70-52 152-50 248Z" fill="#082538" opacity=".55"/>
  <path d="M536 800c-6-136-40-216-116-244l-10-4c40 70 52 152 50 248Z" fill="#082538" opacity=".4"/>
  <path d="M330 566c46 18 94 18 140 0l-10 64c-40 14-80 14-120 0Z" fill="#0d1b26"/>
  <path d="M354 588h92v42h-92Z" fill="#35d6ff" opacity=".18"/>
  <path d="M354 588h92" stroke="#35d6ff" stroke-width="3" opacity=".7"/>

  <!-- chest emblem -->
  <path d="M400 600l30 18v36l-30 18-30-18v-36Z" fill="none" stroke="#8ff0ff" stroke-width="3" opacity=".8"/>
  <path d="M400 612l18 10v24l-18 10-18-10v-24Z" fill="#8ff0ff" opacity=".35"/>

  <!-- neck -->
  <path d="M352 400h96v104h-96Z" fill="url(#skinDark)"/>

  <!-- head -->
  <path d="M400 132c-78 0-128 52-128 126 0 40 12 78 34 106l28 36c18 22 40 34 66 34s48-12 66-34l28-36c22-28 34-66 34-106 0-74-50-126-128-126Z" fill="url(#skin)"/>
  <path d="M400 148c-64 0-110 44-112 108 18-46 56-72 112-72 34 0 62 10 84 30-20-40-50-66-84-66Z" fill="#a9f2ff" opacity=".2"/>

  <!-- crest -->
  <path d="M400 92c18 26 28 54 30 84h-60c2-30 12-58 30-84Z" fill="#8ff0ff" opacity=".65"/>
  <path d="M400 112c8 18 12 38 14 56h-28c2-18 6-38 14-56Z" fill="#e8fdff"/>

  <!-- visor -->
  <path d="M292 236c24-34 62-50 108-50s84 16 108 50l-12 64c-6 32-38 54-96 54s-90-22-96-54Z" fill="url(#visor)" stroke="#2a4c60" stroke-width="4"/>
  <path d="M310 250c18-24 48-38 90-38s72 14 90 38l-8 44c-8 24-34 40-82 40s-74-16-82-40Z" fill="#061018"/>
  <g fill="#7ff3ff">
    <path d="M340 268c16-12 38-12 54 0-14 14-40 14-54 0Z"/>
    <path d="M460 268c-16-12-38-12-54 0 14 14 40 14 54 0Z"/>
  </g>
  <g fill="#e8fdff"><path d="M352 266c8-5 18-5 26 0-6 6-20 6-26 0Z"/><path d="M448 266c-8-5-18-5-26 0 6 6 20 6 26 0Z"/></g>
  <path d="M302 218c28-34 62-50 98-50M498 218c-28-34-62-50-98-50" stroke="#35d6ff" stroke-width="4" fill="none" opacity=".5"/>

  <!-- jaw -->
  <path d="M344 344c18 16 36 24 56 24s38-8 56-24l-14 30c-14 14-28 20-42 20s-28-6-42-20Z" fill="#082538" opacity=".7"/>
  <path d="M368 378h64" stroke="#8ff0ff" stroke-width="4" opacity=".45" stroke-linecap="round"/>

  <!-- speed lines crossing the frame -->
  <g stroke="#8ff0ff" stroke-linecap="round" opacity=".5">
    <path d="M96 214h120" stroke-width="2"/><path d="M616 190h92" stroke-width="2"/>
    <path d="M120 552h84" stroke-width="3"/><path d="M610 580h110" stroke-width="3"/>
  </g>
</svg>
