<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Original stylized portrait of Diamondhead, a Petrosapien made of living green crystal">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="68%">
      <stop offset="0" stop-color="#06302c"/><stop offset=".5" stop-color="#06120f"/><stop offset="1" stop-color="#040708"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6fff2"/><stop offset=".3" stop-color="#5fe8cf"/><stop offset=".7" stop-color="#1e9d8c"/><stop offset="1" stop-color="#0a4b47"/>
    </linearGradient>
    <linearGradient id="crystal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff8e2"/><stop offset=".5" stop-color="#2fb9a6"/><stop offset="1" stop-color="#0b5450"/>
    </linearGradient>
    <linearGradient id="crystalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b7d72"/><stop offset="1" stop-color="#062e2c"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eafff9"/><stop offset=".5" stop-color="#7ff2dd" stop-opacity=".7"/><stop offset="1" stop-color="#2fb9a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <g stroke="#4fe3cf" stroke-width="1" opacity=".07"><path d="M0 620h800M0 710h800M110 0v800M690 0v800"/></g>
  <ellipse cx="400" cy="410" rx="270" ry="270" fill="#4fe3cf" opacity=".13" filter="url(#soft)"/>

  <!-- shoulder shards -->
  <g fill="url(#crystal2)" stroke="#0b5450" stroke-width="3">
    <path d="M232 588l-74-64 84 6 30 66Z"/>
    <path d="M568 588l74-64-84 6-30 66Z"/>
    <path d="M190 512l-46-88 66 44 20 58Z"/>
    <path d="M610 512l46-88-66 44-20 58Z"/>
  </g>

  <!-- torso -->
  <path d="M240 800c4-140 36-222 110-252l50-22 50 22c74 30 106 112 110 252Z" fill="url(#crystalDark)"/>
  <path d="M240 800c4-140 36-222 110-252l18-8c-34 68-44 156-42 260Z" fill="#03211f" opacity=".6"/>
  <path d="M560 800c-4-140-36-222-110-252l-18-8c34 68 44 156 42 260Z" fill="#03211f" opacity=".45"/>

  <!-- faceted torso plates -->
  <g stroke="#9dffec" stroke-width="2.5" opacity=".55" fill="none">
    <path d="M280 800l50-170 70-40 70 40 50 170"/>
    <path d="M330 630l70 46 70-46M400 676v124M310 720h180M288 772h224"/>
    <path d="M250 700l60 18M550 700l-60 18"/>
  </g>
  <ellipse cx="400" cy="606" rx="70" ry="54" fill="url(#core)" opacity=".8"/>

  <!-- chest shard -->
  <path d="M400 574l34 40-34 52-34-52Z" fill="#c6fff2" opacity=".9" filter="url(#glow)"/>

  <!-- neck -->
  <path d="M356 406l44-18 44 18v96h-88Z" fill="url(#crystal2)"/>

  <!-- head: faceted crystal -->
  <path d="M400 122l104 62 30 116-54 104-80 42-80-42-54-104 30-116Z" fill="url(#crystal)"/>
  <path d="M400 122l104 62 30 116-54 104-80 42V122Z" fill="#0a4b47" opacity=".35"/>
  <path d="M400 122l-104 62-30 116 54 104 80 42V122Z" fill="#d8fff7" opacity=".12"/>
  <g stroke="#06302c" stroke-width="4" fill="none" opacity=".5">
    <path d="M400 122v324M296 184l104 58 104-58M266 300l134 62 134-62M320 404l80 42 80-42"/>
  </g>

  <!-- brow ridge -->
  <path d="M304 292l82-26 82 26-16 30-66-16-66 16Z" fill="#0b5450" opacity=".8"/>

  <!-- eyes -->
  <g fill="#eafff9" filter="url(#glow)">
    <path d="M320 322l48-12 14 22-46 14Z"/>
    <path d="M480 322l-48-12-14 22 46 14Z"/>
  </g>
  <g fill="#1e9d8c"><path d="M338 324l28-7 8 12-26 8Z"/><path d="M462 324l-28-7-8 12 26 8Z"/></g>

  <!-- mouth -->
  <path d="M362 396l38 14 38-14-10 24-28 12-28-12Z" fill="#06302c" opacity=".85"/>

  <!-- crystal highlights -->
  <g stroke="#eafff9" stroke-width="3" opacity=".5" stroke-linecap="round">
    <path d="M330 200l30-40M470 214l-20-34M286 336l24 26M520 344l-20 22"/>
  </g>
  <g fill="#c6fff2" opacity=".7">
    <circle cx="176" cy="300" r="3"/><circle cx="632" cy="330" r="4"/><circle cx="606" cy="196" r="2.5"/>
  </g>
</svg>
