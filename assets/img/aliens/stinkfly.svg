<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Original stylized portrait of Stinkfly, a Lepidopteran insectoid alien with four wings and a stinger">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="68%">
      <stop offset="0" stop-color="#26300a"/><stop offset=".5" stop-color="#0c1006"/><stop offset="1" stop-color="#040708"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f56a"/><stop offset=".45" stop-color="#8dc22f"/><stop offset="1" stop-color="#3f6410"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9a22"/><stop offset="1" stop-color="#2b4709"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ffb0" stop-opacity=".55"/><stop offset=".6" stop-color="#9dff5c" stop-opacity=".18"/><stop offset="1" stop-color="#9dff5c" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#ffc247"/><stop offset=".75" stop-color="#e06a12"/><stop offset="1" stop-color="#5c2404"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <g stroke="#b6ff3d" stroke-width="1" opacity=".07"><path d="M0 600h800M0 690h800M130 0v800M670 0v800"/></g>
  <ellipse cx="400" cy="400" rx="280" ry="270" fill="#b6ff3d" opacity=".11" filter="url(#soft)"/>

  <!-- wings -->
  <g fill="url(#wing)" stroke="#d8ffb0" stroke-width="2.5" stroke-opacity=".5">
    <path d="M330 430C230 350 110 350 74 420c40 92 150 138 256 100Z"/>
    <path d="M470 430c100-80 220-80 256-10-40 92-150 138-256 100Z"/>
    <path d="M330 560C244 512 142 522 116 580c46 70 138 96 214 62Z"/>
    <path d="M470 560c86-48 188-38 214 20-46 70-138 96-214 62Z"/>
  </g>
  <g stroke="#d8ffb0" stroke-width="1.5" fill="none" opacity=".3">
    <path d="M320 446 110 406M320 470 130 452M320 494 170 496M480 446 690 406M480 470 670 452M480 494 630 496"/>
  </g>

  <!-- body -->
  <path d="M400 800c-56 0-92-46-92-112 0-52 26-94 58-120l34-26 34 26c32 26 58 68 58 120 0 66-36 112-92 112Z" fill="url(#skinDark)"/>
  <path d="M400 800c-56 0-92-46-92-112 0-52 26-94 58-120l34-26V800Z" fill="#b6ff3d" opacity=".1"/>

  <!-- thorax bands -->
  <g fill="none" stroke="#0c1006" stroke-width="5" opacity=".5">
    <path d="M330 660h140M336 700h128M348 740h104"/>
  </g>

  <!-- stinger -->
  <path d="M400 800c-14-42-16-72-4-96 16 24 22 56 18 96Z" fill="#e06a12"/>
  <path d="M400 800c4-30 6-54 0-70" stroke="#ffc247" stroke-width="3" fill="none"/>

  <!-- neck -->
  <path d="M356 400h88v90h-88Z" fill="url(#skinDark)"/>

  <!-- head -->
  <path d="M400 132c-84 0-140 54-140 128 0 70 52 124 140 124s140-54 140-124c0-74-56-128-140-128Z" fill="url(#skin)"/>
  <path d="M400 148c-72 0-124 46-124 112 14-44 58-70 124-70 30 0 56 6 76 20-18-38-42-62-76-62Z" fill="#eaffc4" opacity=".18"/>

  <!-- antennae -->
  <path d="M356 154c-28-52-64-80-96-82 10 34 34 66 66 94" fill="none" stroke="#8dc22f" stroke-width="8" stroke-linecap="round"/>
  <path d="M444 154c28-52 64-80 96-82-10 34-34 66-66 94" fill="none" stroke="#8dc22f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="70" r="9" fill="#ffc247" filter="url(#glow)"/>
  <circle cx="544" cy="70" r="9" fill="#ffc247" filter="url(#glow)"/>

  <!-- compound eyes -->
  <ellipse cx="322" cy="268" rx="58" ry="66" fill="url(#eye)" filter="url(#glow)"/>
  <ellipse cx="478" cy="268" rx="58" ry="66" fill="url(#eye)" filter="url(#glow)"/>
  <g fill="#5c2404" opacity=".55">
    <circle cx="304" cy="248" r="5"/><circle cx="330" cy="236" r="5"/><circle cx="352" cy="256" r="5"/>
    <circle cx="314" cy="284" r="5"/><circle cx="342" cy="300" r="5"/><circle cx="300" cy="316" r="5"/>
    <circle cx="460" cy="248" r="5"/><circle cx="486" cy="236" r="5"/><circle cx="508" cy="256" r="5"/>
    <circle cx="470" cy="284" r="5"/><circle cx="498" cy="300" r="5"/><circle cx="476" cy="316" r="5"/>
  </g>
  <g fill="#fff8e0" opacity=".8"><circle cx="310" cy="250" r="3"/><circle cx="466" cy="250" r="3"/></g>

  <!-- mouthparts -->
  <path d="M362 366c26 18 50 18 76 0-8 26-24 38-38 38s-30-12-38-38Z" fill="#2b4709"/>
  <path d="M374 380h52" stroke="#ffc247" stroke-width="3" opacity=".6"/>
  <path d="M340 358l-24 22M460 358l24 22" stroke="#2b4709" stroke-width="6" stroke-linecap="round"/>

  <!-- airborne specks -->
  <g fill="#b6ff3d" opacity=".55">
    <circle cx="180" cy="240" r="3"/><circle cx="636" cy="300" r="4"/><circle cx="600" cy="160" r="2.5"/>
    <circle cx="204" cy="470" r="2.5"/><circle cx="660" cy="520" r="3"/>
  </g>
</svg>
