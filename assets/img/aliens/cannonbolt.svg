<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Original stylized portrait of Cannonbolt, an Arburian Pelarota curled into an armored sphere">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="66%">
      <stop offset="0" stop-color="#33280a"/><stop offset=".5" stop-color="#121006"/><stop offset="1" stop-color="#050706"/>
    </radialGradient>
    <radialGradient id="shell" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fff3bd"/><stop offset=".35" stop-color="#ffd23f"/><stop offset=".72" stop-color="#c99412"/><stop offset="1" stop-color="#6b4a04"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d8"/><stop offset=".5" stop-color="#e8b72a"/><stop offset="1" stop-color="#8a5f05"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#d8d4c4"/><stop offset="1" stop-color="#8f8a76"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#ffd23f" stop-opacity=".65"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <g stroke="#ffd23f" stroke-width="1" opacity=".07"><path d="M0 620h800M0 710h800M120 0v800M680 0v800"/></g>
  <ellipse cx="400" cy="430" rx="290" ry="270" fill="#ffd23f" opacity=".13" filter="url(#soft)"/>

  <!-- motion arcs -->
  <g fill="none" stroke="#ffd23f" stroke-linecap="round" opacity=".45">
    <path d="M124 520c-34-92-18-196 44-268" stroke-width="5"/>
    <path d="M676 520c34-92 18-196-44-268" stroke-width="5"/>
    <path d="M92 560c-26-126 0-248 74-338" stroke-width="2" stroke-dasharray="10 14" opacity=".6"/>
    <path d="M708 560c26-126 0-248-74-338" stroke-width="2" stroke-dasharray="10 14" opacity=".6"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="706" rx="230" ry="42" fill="#000" opacity=".55" filter="url(#soft)"/>

  <!-- sphere base -->
  <circle cx="400" cy="410" r="244" fill="url(#shell)"/>
  <circle cx="400" cy="410" r="244" fill="none" stroke="#fff3bd" stroke-width="3" opacity=".4"/>

  <!-- armor plate segmentation -->
  <g fill="none" stroke="#6b4a04" stroke-width="6" opacity=".55">
    <path d="M400 166c86 0 158 44 198 112M400 166c-86 0-158 44-198 112"/>
    <path d="M206 478c34 76 104 132 194 132s160-56 194-132"/>
    <path d="M400 166v132M244 278l156 20 156-20"/>
    <path d="M206 478l160-58 194 58"/>
    <path d="M400 654V540M280 588l120-48 120 48"/>
    <path d="M244 278l-38 200M556 278l38 200"/>
  </g>

  <!-- white plates -->
  <g fill="url(#white)" stroke="#6b4a04" stroke-width="4">
    <path d="M400 210c60 0 110 30 140 76l-140 28-140-28c30-46 80-76 140-76Z"/>
    <path d="M252 512c30 50 84 82 148 82s118-32 148-82l-148-46Z" opacity=".95"/>
    <path d="M400 340l-92 18 30 66 62 22 62-22 30-66Z" opacity=".9"/>
  </g>

  <!-- central energy seam -->
  <path d="M400 166v488" stroke="#fffbe6" stroke-width="4" opacity=".4"/>
  <circle cx="400" cy="410" r="64" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="400" cy="410" r="20" fill="#fffbe6"/>
  <circle cx="400" cy="410" r="8" fill="#c99412"/>

  <!-- seams glow -->
  <g fill="none" stroke="#fff3bd" stroke-width="2.5" opacity=".55">
    <path d="M256 300c40 18 88 28 144 28s104-10 144-28"/>
    <path d="M252 500c40-14 88-22 148-22s108 8 148 22"/>
    <path d="M400 200v110M400 510v110"/>
  </g>

  <!-- impact sparks -->
  <g fill="#fff3bd" filter="url(#glow)">
    <circle cx="152" cy="430" r="5"/><circle cx="188" cy="500" r="3"/><circle cx="646" cy="400" r="4"/>
    <circle cx="612" cy="480" r="3"/><circle cx="560" cy="686" r="4"/><circle cx="238" cy="682" r="3"/>
  </g>
  <g stroke="#ffd23f" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M130 620l40 16M670 620l-40 16M96 470l44 10M704 470l-44 10"/>
  </g>

  <!-- dust -->
  <g fill="#ffd23f" opacity=".18">
    <ellipse cx="220" cy="716" rx="60" ry="14"/><ellipse cx="580" cy="716" rx="70" ry="16"/>
  </g>
</svg>
